name: kotik
description: "Pawday is a Flutter mobile app for keeping a personal pet diary. The app lets users add one or more cats, choose each cat's coloration and personality, track how many days they have spent together, and save diary entries with a mood, description, and photo"

publish_to: 'none' 
version: 1.0.0+1

environment:
  sdk: ^3.11.4


dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  google_fonts: ^8.2.1
  firebase_auth: ^6.6.1
  firebase_core: ^4.14.0
  flutter_screenutil: ^5.9.3
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  flutter_bloc: ^9.1.1
  get_it: ^9.2.1
  go_router: ^17.5.0
  flutter_riverpod: ^3.3.2
  riverpod_annotation: ^4.0.3
  cloud_firestore: ^6.9.0
  dotted_border: ^3.1.0
  firebase_storage: ^13.5.0
  flutter_image_compress: ^2.5.1
  image_picker: ^1.2.3
  path_provider: ^2.1.6
  firebase_messaging: ^16.7.0
  flutter_local_notifications: ^22.3.2


dev_dependencies:
  flutter_test:
    sdk: flutter


  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  freezed: ^3.2.5
  json_serializable: ^6.14.1


flutter:

  uses-material-design: true

  assets:
    - assets/
    - assets/cats/
    - assets/food/

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
